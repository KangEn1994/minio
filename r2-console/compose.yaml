services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
  console:
    build: .
    environment:
      MINIO_ENDPOINT: http://minio:9000
      CONSOLE_HOST: 0.0.0.0
      CONSOLE_PORT: 9090
      CONSOLE_PUBLIC_ORIGIN: ${CONSOLE_PUBLIC_ORIGIN:-http://localhost:9090}
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - minio
volumes:
  minio_data:
